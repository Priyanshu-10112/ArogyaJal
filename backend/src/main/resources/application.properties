spring.application.name=backend

# Google Cloud Configuration
spring.cloud.gcp.project-id=arogyajal-demo
spring.cloud.gcp.firestore.project-id=arogyajal-demo

# Firestore Configuration
spring.cloud.gcp.firestore.enabled=true
spring.cloud.gcp.firestore.credentials.location=classpath:firebase-service-account.json
spring.cloud.gcp.firestore.database-id=(default)

# Firebase Configuration
firebase.project-id=arogyajal-demo
firebase.database-url=https://arogyajal-demo.firebaseio.com


# Server Configuration
server.port=8080
server.address=0.0.0.0


# Logging Configuration
logging.level.root=INFO
logging.level.com.arogyajal=DEBUG
logging.file.name=logs/arogyajal-backend.log
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n

# CORS Configuration
cors.allowed-origins=http://localhost:3000,http://localhost:8080,http://203.81.243.218:8080,https://5d2ba242b144.ngrok-free.app 
cors.allow-credentials=true
cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
cors.allowed-headers=*

# File Upload Configuration
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# ML Service Configuration
ml.service.url=http://localhost:5000

# Python ML API Configuration
ml.python.api.url=http://localhost:5000
ml.python.api.enabled=true
ml.python.api.timeout=30000

# Static Resource Configuration
# Prevent Spring from treating /api/** as static resources
spring.web.resources.add-mappings=true
spring.mvc.static-path-pattern=/static/**
